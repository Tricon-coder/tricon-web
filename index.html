<style>
:root{
  --black:#0a0a09; --green:#123524; --green2:#1b4d36; --ivory:#f6f4ee; --gold:#b89b5e;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:68px}
body{font-family:var(--sans);font-weight:300;background:var(--black);color:var(--ivory);line-height:1.65;font-size:17px;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.1}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}

/* Header */
header{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top);background:rgba(10,10,9,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(184,155,94,.25)}
.bar{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-family:var(--serif);font-size:1.45rem;font-weight:600;text-decoration:none;letter-spacing:.02em}
.logo b{color:var(--gold);font-weight:600}
.tools{display:flex;align-items:center;gap:14px}
.lang{display:flex;border:1px solid var(--gold);border-radius:99px;overflow:hidden}
.lang button{background:none;border:0;color:var(--ivory);font:500 .8rem var(--sans);padding:7px 12px;cursor:pointer;transition:.3s}
.lang button.on{background:var(--gold);color:var(--black)}
.burger{background:none;border:0;width:40px;height:40px;cursor:pointer;display:grid;place-content:center;gap:6px}
.burger span{display:block;width:24px;height:1.5px;background:var(--ivory);transition:.3s}
.burger.open span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
nav{position:fixed;top:calc(61px + env(safe-area-inset-top));left:0;right:0;background:var(--black);padding:8px 24px 24px;display:flex;flex-direction:column;transform:translateY(-12px);opacity:0;visibility:hidden;transition:.35s;border-bottom:1px solid rgba(184,155,94,.25)}
nav.open{transform:none;opacity:1;visibility:visible}
nav a{text-decoration:none;padding:14px 0;border-bottom:1px solid rgba(246,244,238,.08);font-size:1.05rem}
nav a:last-child{border:0}
@media(min-width:900px){
  .burger{display:none}
  nav{position:static;flex-direction:row;gap:22px;padding:0;opacity:1;visibility:visible;transform:none;background:none;border:0}
  nav a{padding:0;border:0;font-size:.82rem;opacity:.85}
  nav a:hover{color:var(--gold);opacity:1}
  .bar{gap:24px}.tools{order:3}
}

/* Hero */
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.hero{position:relative;isolation:isolate;overflow:hidden;min-height:100vh;min-height:100svh;display:flex;align-items:flex-end;padding:110px 0 64px;background:linear-gradient(160deg,var(--green2),var(--black))}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,10,9,.6) 0%,rgba(10,10,9,.4) 28%,rgba(10,10,9,.72) 70%,var(--black) 100%)}
.hero h1,.hero p{text-shadow:0 2px 24px rgba(0,0,0,.55)}
.hero h1{font-size:clamp(2.9rem,12vw,6rem);max-width:12ch;margin-bottom:20px}
.hero p{max-width:34ch;font-size:1.1rem;opacity:.9;margin-bottom:32px}
.rule{width:56px;height:1px;background:var(--gold);margin-bottom:24px}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 28px;border-radius:99px;font:500 .95rem var(--sans);text-decoration:none;cursor:pointer;border:1px solid var(--gold);transition:.3s}
.btn.gold{background:var(--gold);color:var(--black)}
.btn.gold:hover{background:var(--ivory);border-color:var(--ivory)}
.btn.line{background:none;color:var(--ivory)}
.btn.line:hover{background:var(--gold);color:var(--black)}
.row{display:flex;flex-wrap:wrap;gap:12px}

/* Secciones */
section{padding:84px 0}
section h2{font-size:clamp(2.2rem,8vw,3.6rem);margin-bottom:18px}
section .lead{max-width:52ch;opacity:.85;margin-bottom:28px}
.light{background:var(--ivory);color:var(--black)}
.light .lead{opacity:.75}
.green{background:var(--green)}
.photo{position:relative;isolation:isolate;overflow:hidden;min-height:70vh;display:flex;align-items:center}
.photo .wrap{width:100%}
.photo h2,.photo .lead{text-shadow:0 2px 20px rgba(0,0,0,.55)}
.photo::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,10,9,.78),rgba(10,10,9,.4) 50%,rgba(10,10,9,.85))}
#arg{background:linear-gradient(160deg,var(--green2),var(--black));}
#bra{background:linear-gradient(160deg,#0e2a1c,#050504)}
#par{background:linear-gradient(160deg,#1a3a2a,#0a0a09)}
.banner{margin:0 0 28px;border-radius:6px;overflow:hidden;aspect-ratio:16/9;max-height:340px;background:linear-gradient(160deg,var(--green),var(--black))}
.banner img{width:100%;height:100%;object-fit:cover;display:block}

/* Tarjetas de servicio */
.grid{display:grid;gap:16px;margin-bottom:28px}
@media(min-width:760px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}}
.card{border:1px solid rgba(184,155,94,.4);border-radius:6px;padding:26px 24px;display:flex;flex-direction:column;gap:12px;transition:.35s}
.card:hover{border-color:var(--gold);transform:translateY(-3px)}
.light .card{border-color:rgba(18,53,36,.25)}
.card h3{font-size:1.6rem}
.card p{opacity:.82;font-size:.97rem}
.price{font-size:.9rem;color:var(--gold);min-height:1.4em}
.light .price{color:var(--green)}
.card .btn{margin-top:auto;align-self:flex-start;padding:11px 22px;font-size:.88rem}
.light .btn.line{color:var(--black);border-color:var(--green)}
.light .btn.line:hover{background:var(--green);color:var(--ivory)}
.inline-price{margin:0 0 20px}

/* Contacto */
form{display:grid;gap:14px;max-width:520px}
label{font-size:.9rem;opacity:.85;display:grid;gap:6px}
input,select,textarea{font:300 1rem var(--sans);color:var(--ivory);background:rgba(246,244,238,.06);border:1px solid rgba(184,155,94,.4);border-radius:6px;padding:13px 14px;width:100%}
select option{color:#111}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
textarea{min-height:96px;resize:vertical}
.two-f{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:480px){.two-f{grid-template-columns:1fr 1fr}}
form label,input,select,textarea{min-width:0;max-width:100%}
input,select,textarea{color-scheme:dark;-webkit-appearance:none;appearance:none}
input[type=date],input[type=number]{min-height:50px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
.credits{margin-top:6px;font-size:.78rem}
footer{padding:36px 0 110px;text-align:center;font-size:.85rem;opacity:.7;border-top:1px solid rgba(184,155,94,.25)}

/* WhatsApp flotante */
.wa{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;width:52px;height:52px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 6px 22px rgba(0,0,0,.45);transition:opacity .35s,transform .35s}
.wa.hide{opacity:0;transform:translateY(16px);pointer-events:none}
.wa:hover{transform:scale(1.08)}
.wa svg{width:27px;height:27px;fill:#fff}

/* Aparición suave */
.rv{opacity:0;transform:translateY(22px);transition:opacity .9s ease,transform .9s ease}
.rv.in{opacity:1;transform:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>

  priv_t:"Private and tailor-made services", priv_p:"We build the route around your schedule, your group and what you want to see. Tell us your idea and we'll plan it together.", priv_cta:"Ask on WhatsApp",
  con_t:"Contact and bookings", con_p:"Fill in the form and WhatsApp will open with your request ready to send.",
  f_name:"Name", f_serv:"Service", f_date:"Date", f_pax:"Passengers", f_msg:"Message (flight, hotel, times)", f_msg_ph:"Optional", f_send:"Send via WhatsApp",
  svc:{aero_in:"Airport to hotel", aero_out:"Hotel to airport", hotel_dest:"Hotel to attraction", hotel_hotel:"Hotel to hotel", arg:"Argentine Falls", bra:"Brazilian Falls", par:"Paraguay excursion", priv:"Private / tailor-made service", general:"Other inquiry"},
  wa_g:"Hello TriCon Transfers, I'd like to make an inquiry.", wa_s:"Hello TriCon Transfers, I'd like a quote for: ",
  wa_r:["Hello TriCon Transfers, I'd like to book.","Name: ","Service: ","Date: ","Passengers: ","Message: "]
 }
};
const $=(s,c=document)=>c.querySelector(s), $$=(s,c=document)=>[...c.querySelectorAll(s)];
let lang=(()=>{try{const s=localStorage.getItem("tc_lang");if(s)return s}catch(e){}return (navigator.language||"es").toLowerCase().startsWith("en")?"en":"es"})();

const wa=t=>`https://wa.me/${PHONE}?text=${encodeURIComponent(t)}`;
function waFor(key){const t=T[lang];return wa(key==="general"?t.wa_g:t.wa_s+t.svc[key])}

function photoUrl(v,w){
  v=(v||"").trim(); if(!v) return "";
  const m=v.match(/^(\d+)$/)||v.match(/pexels\.com\/.*?(\d+)\/?(?:[?#].*)?$/);
  if(m) return `https://images.pexels.com/photos/${m[1]}/pexels-photo-${m[1]}.jpeg?auto=compress&cs=tinysrgb&w=${w}`;
  try{
    const u=new URL(v);
    if(u.hostname==="images.pexels.com"){u.searchParams.set("auto","compress");u.searchParams.set("w",w)}
    else if(u.hostname==="images.unsplash.com"){u.searchParams.set("auto","format");u.searchParams.set("q","70");u.searchParams.set("w",w)}
    return u.toString();
  }catch(e){return ""}
}
function loadPhotos(){
  $$("[data-photo]").forEach(img=>{
    const v=PHOTOS[img.dataset.photo];
    if(!photoUrl(v,800)){(img.closest(".banner")||img).remove();return}
    img.srcset=[480,800,1200,1800].map(w=>photoUrl(v,w)+" "+w+"w").join(", ");
    img.src=photoUrl(v,1200);
  });
}
function apply(){
  const t=T[lang];
  document.documentElement.lang=lang;
  document.title=t.title;$("meta[name=description]").content=t.desc;
  $$("[data-aria]").forEach(e=>e.setAttribute("aria-label",t[e.dataset.aria]));
  $$("[data-i]").forEach(e=>e.textContent=t[e.dataset.i]);
  $$("[data-ph]").forEach(e=>e.placeholder=t[e.dataset.ph]);
  $$("[data-wa]").forEach(e=>{e.href=waFor(e.dataset.wa);e.target="_blank";e.rel="noopener"});
  $$("[data-price]").forEach(e=>e.textContent=PRICES[e.dataset.price]||"");
  const sel=$("#serv"),cur=sel.value;
  sel.innerHTML=Object.entries(t.svc).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
  if(cur)sel.value=cur;
  $$(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.lang===lang));
  try{localStorage.setItem("tc_lang",lang)}catch(e){}
}
$$(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;apply()});

/* Menú móvil */
const burger=$(".burger"),menu=$("#menu");
burger.onclick=()=>{const o=menu.classList.toggle("open");burger.classList.toggle("open",o);burger.setAttribute("aria-expanded",o)};
$$("#menu a").forEach(a=>a.addEventListener("click",()=>{menu.classList.remove("open");burger.classList.remove("open")}));

/* Formulario -> WhatsApp */
$("#rf").addEventListener("submit",e=>{
  e.preventDefault();
  const f=e.target,t=T[lang],r=t.wa_r;
  const msg=[r[0],r[1]+f.name.value,r[2]+t.svc[f.serv.value],f.date.value&&r[3]+f.date.value,f.pax.value&&r[4]+f.pax.value,f.msg.value&&r[5]+f.msg.value].filter(Boolean).join("\n");
  window.open(wa(msg),"_blank","noopener");
});

/* Aparición suave */
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.12});
$$(".rv").forEach(e=>io.observe(e));
$("#yr").textContent=new Date().getFullYear();

/* El botón flotante se oculta sobre la portada y el formulario, donde ya hay botones de WhatsApp */
const waBtn=$(".wa"),seen=new Set();
const wo=new IntersectionObserver(es=>{es.forEach(x=>x.isIntersecting?seen.add(x.target):seen.delete(x.target));waBtn.classList.toggle("hide",seen.size>0)},{threshold:.3});
[$("#inicio"),$("#rf")].forEach(e=>wo.observe(e));
loadPhotos();
apply();
</script>
</body>
</html>
